<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스쿨랜더 Schoolendar · 학교 생활 캘린더</title>
<style>
:root{
  --blue:#dce9fb; --blue-d:#6f9ceb;
  --mint:#d8f3ea; --mint-d:#4fbf94;
  --yellow:#fdf1cf; --yellow-d:#e8b923;
  --pink:#fbe1ec; --pink-d:#e8679f;
  --purple:#ece3fb; --purple-d:#9b7ce0;
  --ink:#2c2a3a; --sub:#8a869c; --line:#ece9f5;
  --bg:#fbfaff; --card:#ffffff;
  --radius:16px; --shadow:0 4px 18px rgba(90,80,150,.08);
  --today-ring: 0 0 0 2px var(--purple-d);
}
*{box-sizing:border-box;}
body.dark{
  --ink:#eceaf5; --sub:#a8a4bd; --line:#3a3750; --bg:#1b1927; --card:#242238;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.app{display:flex; min-height:100vh;}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{
  width:220px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
  padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px;
}
.brand{display:flex; align-items:center; gap:8px; padding:6px 10px 22px; font-weight:800; font-size:19px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--pink-d),var(--purple-d));}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
  color:var(--sub); font-weight:600; font-size:14.5px; border:none; background:transparent; text-align:left; width:100%;
}
.nav-item:hover{background:var(--blue); color:var(--ink);}
.nav-item.active{background:var(--ink); color:#fff;}
body.dark .nav-item.active{background:var(--purple-d); color:#fff;}
.nav-item .ic{width:18px;text-align:center;}
.sidebar-foot{margin-top:auto; font-size:12px; color:var(--sub); padding:10px;}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding-bottom:80px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:18px 26px; border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:20;
}
.topbar h1{font-size:19px; margin:0; font-weight:800;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;
}
.badge{
  position:absolute; top:-4px; right:-4px; background:var(--pink-d); color:#fff; font-size:10px; font-weight:700;
  min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.btn{
  padding:9px 16px; border-radius:12px; border:none; font-weight:700; font-size:13.5px;
  background:var(--ink); color:#fff;
}
body.dark .btn{background:var(--purple-d);}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.btn.danger{background:#f4d4d4; color:#a23a3a;}

.content{padding:22px 26px;}
.section-title{font-size:15px; font-weight:800; margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}
.grid{display:grid; gap:12px;}
.g-3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.g-2{grid-template-columns:1fr 1fr;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;}
.card.pastel-blue{background:var(--blue);}
.card.pastel-mint{background:var(--mint);}
.card.pastel-yellow{background:var(--yellow);}
.card.pastel-pink{background:var(--pink);}
.card.pastel-purple{background:var(--purple);}
/* 파스텔 배경은 항상 밝으므로, 다크모드에서도 카드 안 글자색은 어두운 색으로 고정해 가독성을 확보 */
.pastel-blue,.pastel-mint,.pastel-yellow,.pastel-pink,.pastel-purple{ --ink:#2c2a3a; --sub:#8a869c; color:var(--ink); }
.today-hero{ --ink:#2c2a3a; --sub:#5a5670; }

.period-card{
  border-radius:14px; padding:12px 14px; border:1px solid rgba(0,0,0,.04); position:relative; cursor:pointer;
  transition:transform .12s ease;
}
.period-card:hover{transform:translateY(-2px);}
.period-card .pnum{font-size:11px; font-weight:800; opacity:.65; letter-spacing:.02em;}
.period-card .psub{font-size:16px; font-weight:800; margin:4px 0 2px;}
.period-card .pteacher{font-size:12px; opacity:.7;}
.period-card .ptime{font-size:11px; opacity:.55; margin-top:6px;}
.period-card.now{box-shadow:var(--today-ring);}
.period-card.past{opacity:.45;}
.period-card .ev-dot{position:absolute; top:10px; right:10px; width:8px;height:8px;border-radius:50%;background:var(--pink-d);}

.empty{
  text-align:center; padding:40px 20px; color:var(--sub); font-size:13.5px;
}
.empty .big{font-size:30px; margin-bottom:8px;}

/* ---------- Today ---------- */
.today-hero{
  border-radius:20px; padding:22px; background:linear-gradient(135deg,var(--blue),var(--purple));
  margin-bottom:6px;
}
.today-hero .date{font-size:13px; font-weight:700; opacity:.7;}
.today-hero h2{margin:4px 0 0; font-size:24px;}

.meal-list{display:flex; flex-direction:column; gap:6px; font-size:14.5px;}
.meal-list div{padding:2px 0;}

.event-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--card);
  border:1px solid var(--line); margin-bottom:8px; cursor:pointer;
}
.event-row .tag{font-size:11px; font-weight:800; background:var(--yellow); padding:3px 8px; border-radius:8px; white-space:nowrap;}
.event-row .et{font-weight:700; font-size:14px;}
.event-row .ed{font-size:12px; color:var(--sub);}

/* ---------- Calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-head .title{font-weight:800; font-size:17px;}
.cal-nav{display:flex; gap:6px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:12px; font-weight:700; color:var(--sub); padding-bottom:4px;}
.cal-cell{
  min-height:88px; border-radius:12px; border:1px solid var(--line); background:var(--card); padding:6px;
  cursor:pointer; display:flex; flex-direction:column; gap:3px; font-size:11.5px;
}
.cal-cell.other{opacity:.35;}
.cal-cell.today{box-shadow:var(--today-ring);}
.cal-cell .dnum{font-weight:800; font-size:13px;}
.cal-tag{font-size:10px; padding:1px 5px; border-radius:6px; display:inline-block; width:fit-content;}
.tag-meal{background:var(--yellow);}
.tag-event{background:var(--pink);}

.week-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.week-table th,.week-table td{border:1px solid var(--line); padding:8px 6px; text-align:center; vertical-align:top;}
.week-table th{background:var(--card); font-weight:800;}
.week-table td.today-col{background:var(--blue);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(30,25,50,.35); display:none; align-items:flex-end; justify-content:center; z-index:100;
}
.overlay.show{display:flex;}
.modal{
  background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow:auto;
  animation:up .18s ease;
}
@media(min-width:700px){
  .overlay{align-items:center;}
  .modal{border-radius:20px; margin-bottom:0;}
}
@keyframes up{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal h3{margin:0 0 14px; font-size:17px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px;
}
.field textarea{resize:vertical; min-height:60px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{flex:1;}
.choice-row{display:flex; gap:8px; margin-top:6px;}
.choice-row .btn{flex:1;}
.err{color:#c0446b; font-size:12px; margin-top:4px; display:none;}
.attach-item{display:flex; align-items:center; justify-content:space-between; background:var(--bg); padding:8px 10px; border-radius:10px; margin-top:6px; font-size:13px;}
.attach-item a{color:var(--ink); text-decoration:none;}
.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute; inset:0; background:var(--line); border-radius:24px; transition:.2s;}
.slider:before{content:"";position:absolute; width:18px;height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--mint-d);}
.switch input:checked + .slider:before{transform:translateX(18px);}
.switch-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}

/* ---------- Search ---------- */
.search-box{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:14px;}
.search-box input{border:none; outline:none; background:transparent; flex:1; font-size:14px; color:var(--ink);}

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav{display:none;}
@media(max-width:860px){
  .sidebar{display:none;}
  .app{flex-direction:column;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:700; color:var(--sub); padding:6px 2px;
  }
  .bottom-nav button.active{color:var(--ink);}
  body.dark .bottom-nav button.active{color:var(--purple-d);}
  .bottom-nav .ic{font-size:18px;}
  .content{padding:16px;}
  .topbar{padding:14px 16px;}
  .g-2{grid-template-columns:1fr;}
}

.pill-tabs{display:flex; gap:6px; margin-bottom:14px; background:var(--card); border:1px solid var(--line); padding:4px; border-radius:12px; width:fit-content;}
.pill-tabs button{border:none; background:transparent; padding:8px 16px; border-radius:9px; font-weight:700; font-size:13px; color:var(--sub);}
.pill-tabs button.active{background:var(--ink); color:#fff;}
body.dark .pill-tabs button.active{background:var(--purple-d);}

.dow-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px;}
.dow-tabs button{border:1px solid var(--line); background:var(--card); padding:9px 16px; border-radius:12px; font-weight:700; font-size:13px; white-space:nowrap; color:var(--sub);}
.dow-tabs button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
body.dark .dow-tabs button.active{background:var(--purple-d); border-color:var(--purple-d);}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
  border-radius:12px; font-size:13px; z-index:200; opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; bottom:110px;}
@media(min-width:861px){.toast{bottom:24px;} .toast.show{bottom:34px;}}

.notif-item{padding:10px 12px; border-radius:12px; background:var(--bg); margin-bottom:8px; font-size:13px;}
.notif-item .nt-title{font-weight:800; margin-bottom:2px;}
.notif-item .nt-time{font-size:11px; color:var(--sub);}
.sample-badge{font-size:10px; background:var(--yellow); padding:2px 6px; border-radius:6px; margin-left:6px; font-weight:700;}
.hint{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.5;}
kbd{background:var(--line); padding:1px 6px; border-radius:5px; font-size:11px;}
</style>
</head>
<body>
<div class="app">

  <!-- Desktop sidebar -->
  <div class="sidebar">
    <div class="brand"><span class="dot"></span> 스쿨랜더</div>
    <button class="nav-item" data-view="today"><span class="ic">🏠</span> 오늘</button>
    <button class="nav-item" data-view="calendar"><span class="ic">📅</span> 캘린더</button>
    <button class="nav-item" data-view="schedule"><span class="ic">🗓️</span> 시간표</button>
    <button class="nav-item" data-view="meal"><span class="ic">🍚</span> 급식</button>
    <button class="nav-item" data-view="events"><span class="ic">📌</span> 일정</button>
    <button class="nav-item" data-view="notif"><span class="ic">🔔</span> 알림</button>
    <button class="nav-item" data-view="settings"><span class="ic">⚙️</span> 설정</button>
    <div class="sidebar-foot">스쿨랜더 · 학교생활 매니저<br>모든 데이터는 이 브라우저에만 저장돼요.</div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="topbarTitle">오늘</h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnNotif" title="알림 센터">🔔<span class="badge" id="notifBadge" style="display:none;">0</span></button>
        <button class="btn" id="btnAddEvent">+ 일정 추가</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div class="bottom-nav">
    <button data-view="today"><span class="ic">🏠</span>오늘</button>
    <button data-view="calendar"><span class="ic">📅</span>캘린더</button>
    <button data-view="schedule"><span class="ic">🗓️</span>시간표</button>
    <button data-view="meal"><span class="ic">🍚</span>급식</button>
    <button data-view="settings"><span class="ic">⚙️</span>설정</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   스쿨랜더(Schoolendar) — 학생용 학교 시간표·급식·일정 관리 웹앱
   순수 HTML/CSS/JS. 서버 없이 localStorage(설정값) + IndexedDB(첨부파일)로 동작.
   ========================================================================= */

/* ---------------- 상수 ---------------- */
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_KR = ['일','월','화','수','목','금','토'];
const WEEKDAYS = ['mon','tue','wed','thu','fri']; // 기본 시간표 대상 요일
const LS = {
  schedule: 'sch_recurringSchedule',
  overrides: 'sch_dateOverrides',
  events: 'sch_events',
  meals: 'sch_meals',
  settings: 'sch_settings',
  notifLog: 'sch_notifLog',
  periodTimes: 'sch_periodTimes'
};
const PASTELS = ['pastel-blue','pastel-mint','pastel-yellow','pastel-pink','pastel-purple'];

/* ---------------- 유틸 ---------------- */
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseDate(s){const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);}
function todayStr(){return fmtDate(new Date());}
function addDays(dateStr,n){const d=parseDate(dateStr); d.setDate(d.getDate()+n); return fmtDate(d);}
function dowOf(dateStr){return DOW[parseDate(dateStr).getDay()];}
function isWeekday(dateStr){const d=parseDate(dateStr).getDay(); return d>=1 && d<=5;}
function fmtKrDate(dateStr){const d=parseDate(dateStr); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW_KR[d.getDay()]}요일`;}
function fmtMD(dateStr){const d=parseDate(dateStr); return `${d.getMonth()+1}/${d.getDate()}`;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------------- 저장소 ---------------- */
const Store = {
  load(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};

let state = {
  schedule: Store.load(LS.schedule, { mon:[], tue:[], wed:[], thu:[], fri:[] }),
  overrides: Store.load(LS.overrides, {}),        // { "YYYY-MM-DD": [period,...] }
  events: Store.load(LS.events, []),               // [{id,date,title,description,period,startTime,endTime,attachments:[{id,name,type}],notification:{enabled,type,time}}]
  meals: Store.load(LS.meals, {}),                 // { "YYYY-MM-DD": {meals:[],allergy,nutrition,origin,note} }
  settings: Store.load(LS.settings, {
    periodCount: 6,
    notifDefaultTime: '20:00',
    mealNotifEnabled: false,
    mealNotifTime: '20:00',
    defaultView: 'month',
    hour24: true,
    darkMode: false,
    kakaoKey: '',
    kakaoLinked: false,
    kakaoToken: null,
    syncEnabled: false,
    syncProjectId: '',
    syncApiKey: '',
    auth: null
  }),
  notifLog: Store.load(LS.notifLog, []),           // [{id,title,body,time,read}]
  periodTimes: Store.load(LS.periodTimes, defaultPeriodTimes()),
  updatedAt: Store.load('sch_updatedAt', 0)
};

function defaultPeriodTimes(){
  const base = [['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['13:00','13:50'],['14:00','14:50'],['15:00','15:50'],['16:00','16:50']];
  const map = {};
  base.forEach((t,i)=> map[i+1] = {start:t[0], end:t[1]});
  return map;
}

function persist(){
  state.updatedAt = Date.now();
  Store.save(LS.schedule, state.schedule);
  Store.save(LS.overrides, state.overrides);
  Store.save(LS.events, state.events);
  Store.save(LS.meals, state.meals);
  Store.save(LS.settings, state.settings);
  Store.save(LS.notifLog, state.notifLog);
  Store.save(LS.periodTimes, state.periodTimes);
  Store.save('sch_updatedAt', state.updatedAt);
  schedulePush();
}

/* ---------------- IndexedDB (첨부파일) ---------------- */
let idb = null;
function initDB(){
  return new Promise((resolve)=>{
    const req = indexedDB.open('SchoolAppDB', 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore('attachments', {keyPath:'id'}); };
    req.onsuccess = e => { idb = e.target.result; resolve(); };
    req.onerror = () => resolve(); // IndexedDB 사용 불가 시에도 앱은 동작 (첨부파일만 제한)
  });
}
function idbPut(record){
  return new Promise((resolve,reject)=>{
    if(!idb) return reject('no-db');
    const tx = idb.transaction('attachments','readwrite');
    tx.objectStore('attachments').put(record);
    tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error);
  });
}
function idbGet(id){
  return new Promise((resolve)=>{
    if(!idb) return resolve(null);
    const tx = idb.transaction('attachments','readonly');
    const req = tx.objectStore('attachments').get(id);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>resolve(null);
  });
}
function idbDelete(id){
  if(!idb) return;
  const tx = idb.transaction('attachments','readwrite');
  tx.objectStore('attachments').delete(id);
}

/* ---------------- 시간표 조회 (반복 vs 예외) ---------------- */
// 우선순위: 특정 날짜 예외 > 요일 반복 시간표
function getScheduleForDate(dateStr){
  if(state.overrides[dateStr]) return { periods: state.overrides[dateStr], isOverride:true };
  const dow = dowOf(dateStr);
  if(WEEKDAYS.includes(dow)) return { periods: state.schedule[dow]||[], isOverride:false };
  return { periods: [], isOverride:false };
}
function hasAnySchedule(){
  return WEEKDAYS.some(d => (state.schedule[d]||[]).length>0);
}

/* ---------------- 일정 조회 ---------------- */
function eventsOnDate(dateStr){
  return state.events.filter(e=>e.date===dateStr).sort((a,b)=>(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
}

/* ---------------- 급식 조회 ---------------- */
function mealOnDate(dateStr){ return state.meals[dateStr] || null; }
function maxKnownPeriod(){
  let max = state.settings.periodCount;
  WEEKDAYS.forEach(d=> (state.schedule[d]||[]).forEach(p=>{ if(p.period>max) max=p.period; }));
  Object.values(state.overrides).forEach(list=> list.forEach(p=>{ if(p.period>max) max=p.period; }));
  return max;
}

/* ---------------- 뷰 라우팅 ---------------- */
let currentView = 'today';
let calMode = 'month'; // month/week/day
let calAnchor = todayStr(); // 캘린더 기준 날짜
let scheduleDow = (()=>{ const d=DOW[new Date().getDay()]; return WEEKDAYS.includes(d)?d:'mon'; })();
let mealTab = 'today';

function setView(v){
  currentView = v;
  document.querySelectorAll('.nav-item,.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  const titles = {today:'오늘', calendar:'캘린더', schedule:'시간표', meal:'급식', events:'일정', notif:'알림', settings:'설정'};
  document.getElementById('topbarTitle').textContent = titles[v]||'';
  render();
}

function render(){
  const c = document.getElementById('content');
  if(currentView==='today') c.innerHTML = renderToday();
  else if(currentView==='calendar') c.innerHTML = renderCalendar();
  else if(currentView==='schedule') c.innerHTML = renderSchedule();
  else if(currentView==='meal') c.innerHTML = renderMeal();
  else if(currentView==='events') c.innerHTML = renderEventsList();
  else if(currentView==='notif') c.innerHTML = renderNotifCenter();
  else if(currentView==='settings') c.innerHTML = renderSettings();
  bindDynamicHandlers();
  updateNotifBadge();
}

/* ---------------- 오늘 화면 ---------------- */
function renderPeriodCard(p, dateStr, idx){
  const now = new Date();
  const isTodayReal = dateStr===todayStr();
  let cls='';
  if(isTodayReal && p.startTime && p.endTime){
    const nowM = now.getHours()*60+now.getMinutes();
    const [sh,sm]=p.startTime.split(':').map(Number), [eh,em]=p.endTime.split(':').map(Number);
    const s=sh*60+sm, e=eh*60+em;
    if(nowM>=s && nowM<=e) cls='now'; else if(nowM>e) cls='past';
  }
  const hasEvent = eventsOnDate(dateStr).some(ev=>String(ev.period)===String(p.period));
  const pastel = PASTELS[idx % PASTELS.length];
  return `<div class="period-card card ${pastel} ${cls}" data-open-period="${p.period}" data-date="${dateStr}">
    ${hasEvent?'<span class="ev-dot"></span>':''}
    <div class="pnum">${p.period}교시</div>
    <div class="psub">${esc(p.subject||'—')}</div>
    <div class="pteacher">${p.teacher? esc(p.teacher)+' 선생님':''}</div>
    <div class="ptime">${p.startTime&&p.endTime? `${p.startTime} - ${p.endTime}`:''}</div>
  </div>`;
}

function renderDaySchedule(dateStr){
  const {periods} = getScheduleForDate(dateStr);
  if(!isWeekday(dateStr) && periods.length===0){
    return `<div class="empty"><div class="big">🌤️</div>주말에는 기본 시간표가 없어요.</div>`;
  }
  if(periods.length===0){
    return `<div class="empty"><div class="big">🗒️</div>시간표가 설정되지 않았습니다.</div>`;
  }
  const sorted = [...periods].sort((a,b)=>a.period-b.period);
  return `<div class="grid g-3">${sorted.map((p,i)=>renderPeriodCard(p,dateStr,i)).join('')}</div>`;
}

function renderMealBlock(dateStr, title){
  const m = mealOnDate(dateStr);
  if(!m || !m.meals || m.meals.length===0){
    return `<div class="empty" style="padding:24px;"><div class="big">🍽️</div>등록된 급식 정보가 없습니다.</div>`;
  }
  return `<div class="card pastel-yellow meal-list">
    ${m.meals.map(x=>`<div>🍚 ${esc(x)}</div>`).join('')}
    ${m.allergy?`<div class="hint">알레르기: ${esc(m.allergy)}</div>`:''}
  </div>`;
}

function renderEventsBlock(dateStr){
  const evs = eventsOnDate(dateStr);
  if(evs.length===0) return `<div class="empty" style="padding:24px;"><div class="big">📭</div>등록된 일정이 없습니다.</div>`;
  return evs.map(ev=>`

        <div class="ed">${esc(ev.description||'')}${ev.attachments&&ev.attachments.length?` · 📎 ${ev.attachments.length}개`:''}</div>

}

/* ---------------- 캘린더 ---------------- */
function renderCalendar(){
  return `
    <div class="pill-tabs">
      <button data-calmode="month" class="${calMode==='month'?'active':''}">월간</button>
      <button data-calmode="week" class="${calMode==='week'?'active':''}">주간</button>
      <button data-calmode="day" class="${calMode==='day'?'active':''}">일간</button>
    </div>
    ${calMode==='month'?renderMonthView():calMode==='week'?renderWeekView():renderDayView()}
  `;
}

function renderMonthView(){
  const anchor = parseDate(calAnchor);
  const y=anchor.getFullYear(), m=anchor.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++){
    const d = new Date(y,m,1-(startOffset-i));
    cells.push({dateStr:fmtDate(d), other:true});
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({dateStr:fmtDate(new Date(y,m,d)), other:false});
  }
  while(cells.length%7!==0 || cells.length<42){
    const last = parseDate(cells[cells.length-1].dateStr);
    const nd = new Date(last); nd.setDate(nd.getDate()+1);
    cells.push({dateStr:fmtDate(nd), other:true});
    if(cells.length>=42) break;
  }
  const t = todayStr();
  return `
    <div class="cal-head">
      <button class="icon-btn" id="calPrev">‹</button>
      <div class="title">${y}년 ${m+1}월</div>
      <div class="cal-nav"><button class="btn ghost sm" id="calToday">오늘</button><button class="icon-btn" id="calNext">›</button></div>
    </div>
    <div class="cal-grid">
      ${DOW_KR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        const evs = eventsOnDate(c.dateStr);
        const meal = mealOnDate(c.dateStr);
        return `<div class="cal-cell ${c.other?'other':''} ${c.dateStr===t?'today':''}" data-open-day="${c.dateStr}">
          <div class="dnum">${parseDate(c.dateStr).getDate()}</div>
          ${meal&&meal.meals&&meal.meals.length?`<span class="cal-tag tag-meal">🍚 급식</span>`:''}
          ${evs.length?`<span class="cal-tag tag-event">${evs.length}건 · ${esc(evs[0].title.slice(0,6))}</span>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function startOfWeek(dateStr){
  const d = parseDate(dateStr); const day=d.getDay();
  const diff = day===0? -6 : 1-day; // 월요일 시작
  d.setDate(d.getDate()+diff); return fmtDate(d);
}

function renderWeekView(){
  const start = startOfWeek(calAnchor);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const t = todayStr();
  const maxPeriod = Math.max(state.settings.periodCount, ...WEEKDAYS.map(d=>(state.schedule[d]||[]).reduce((a,p)=>Math.max(a,p.period),0)), 1);
  const rows=[];
  for(let p=1;p<=maxPeriod;p++){
    rows.push(`<tr><th>${p}교시</th>${days.map(ds=>{
      const {periods} = getScheduleForDate(ds);
      const found = periods.find(x=>x.period===p);
      return `<td class="${ds===t?'today-col':''}">${found?esc(found.subject):''}</td>`;
    }).join('')}</tr>`);
  }
  return `
    <div class="cal-head">
      <button class="icon-btn" id="calPrev">‹</button>
      <div class="title">${fmtMD(days[0])} - ${fmtMD(days[6])}</div>
      <div class="cal-nav"><button class="btn ghost sm" id="calToday">오늘</button><button class="icon-btn" id="calNext">›</button></div>
    </div>
    <div style="overflow-x:auto;">
    <table class="week-table">
      <thead><tr><th></th>${days.map(ds=>`<th class="${ds===t?'today-col':''}" data-open-day="${ds}" style="cursor:pointer;">${DOW_KR[parseDate(ds).getDay()]}<br><span style="font-weight:600;color:var(--sub);">${fmtMD(ds)}</span></th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}
        <tr><th>일정</th>${days.map(ds=>{
          const evs=eventsOnDate(ds);
          return `<td>${evs.map(e=>`<div style="font-size:11px;">📌${esc(e.title.slice(0,8))}</div>`).join('')}</td>`;
        }).join('')}</tr>
      </tbody>
    </table>
    </div>
  `;
}

function renderDayView(){
  const ds = calAnchor;
  const {periods} = getScheduleForDate(ds);
  const sorted = [...periods].sort((a,b)=>a.period-b.period);
  return `
    <div class="cal-head">
      <button class="icon-btn" id="calPrev">‹</button>
      <div class="title">${fmtKrDate(ds)}</div>
      <div class="cal-nav"><button class="btn ghost sm" id="calToday">오늘</button><button class="icon-btn" id="calNext">›</button></div>

    <div class="section-title">시간표</div>

    <div class="section-title">급식</div>
    ${renderMealBlock(ds)}

}

function renderMealWeek(){
  const start = startOfWeek(calAnchor);

  const t = todayStr();

function renderMealMonth(){
  const anchor = parseDate(calAnchor);
  const y=anchor.getFullYear(), m=anchor.getMonth();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let html = `<div class="cal-head">
      <button class="icon-btn" id="mealMonthPrev">‹</button>
      <div class="title">${y}년 ${m+1}월 급식</div>
      <div class="cal-nav"><button class="btn ghost sm" id="mealMonthToday">이번 달</button><button class="icon-btn" id="mealMonthNext">›</button></div>
    </div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = fmtDate(new Date(y,m,d));
    const dow = parseDate(ds).getDay();
    const mo = mealOnDate(ds);
    const weekend = dow===0||dow===6;
    html += `<div class="card" style="margin-bottom:8px;" data-open-meal="${ds}">
      <div style="font-weight:800; font-size:13px;">${m+1}월 ${d}일 ${DOW_KR[dow]}요일</div>
      <div class="hint" style="margin-top:4px;">${mo&&mo.meals&&mo.meals.length? esc(mo.meals.join(' / ')) : (weekend?'급식 없음 (주말)':'급식 없음')}</div>
    </div>`;
  }
  return html;
}

/* ---------------- 일정 목록 (검색) ---------------- */
function renderEventsList(){
  return `
    <div class="search-box"><span>🔍</span><input id="searchInput" placeholder="일정 제목, 내용, 날짜, 첨부파일 검색"></div>
    <div id="eventsListResult">${renderEventSearchResults('')}</div>
  `;
}
function renderEventSearchResults(q){
  q = (q||'').trim().toLowerCase();
  let list = state.events.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(q){
    list = list.filter(e =>
      (e.title||'').toLowerCase().includes(q) ||
      (e.description||'').toLowerCase().includes(q) ||
      (e.date||'').includes(q) ||
      (e.attachments||[]).some(a=>(a.name||'').toLowerCase().includes(q))
    );
  }
  if(list.length===0) return `<div class="empty"><div class="big">📭</div>${q?'검색 결과가 없습니다.':'등록된 일정이 없습니다.'}</div>`;
  return list.map(ev=>`
    <div class="event-row" data-open-event="${ev.id}">
      <div class="tag">${fmtMD(ev.date)}</div>
      <div style="flex:1;">
        <div class="et">${esc(ev.title)}</div>
        <div class="ed">${ev.period?ev.period+'교시 · ':''}${esc(ev.description||'')}</div>
      </div>
    </div>`).join('');
}

        <div>${n.body.split('\n').map(l=>esc(l)).join('<br>')}</div>
        <div class="nt-time">${n.time}</div>
      </div>`).join('')}

}
function updateNotifBadge(){
  const unread = state.notifLog.filter(n=>!n.read).length;
  const badge = document.getElementById('notifBadge');
  if(unread>0){ badge.style.display='flex'; badge.textContent = unread>9?'9+':unread; }
  else badge.style.display='none';
}

  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

/* ---------------- 일정 추가/수정 모달 ---------------- */
function openEventModal(dateStr, existing){
  const ev = existing || {id:null,date:dateStr||todayStr(),title:'',description:'',period:'',startTime:'',endTime:'',attachments:[],notification:{enabled:false,type:'dayBefore',time:state.settings.notifDefaultTime}};
  openModal(`
    <h3>${existing?'일정 수정':'일정 추가'}</h3>
    <div class="field"><label>일정 제목 *</label><input id="evTitle" value="${esc(ev.title)}" placeholder="예: 과학 수행평가"></div>
    <div class="field"><label>날짜 *</label><input type="date" id="evDate" value="${ev.date}"></div>
    <div class="row2">
      <div class="field"><label>시작 시간</label><input type="time" id="evStart" value="${ev.startTime||''}"></div>
      <div class="field"><label>종료 시간</label><input type="time" id="evEnd" value="${ev.endTime||''}"></div>
    </div>
    <div class="field"><label>관련 교시</label>
      <select id="evPeriod"><option value="">없음</option>${Array.from({length:maxKnownPeriod()},(_,i)=>i+1).map(p=>`<option value="${p}" ${String(ev.period)===String(p)?'selected':''}>${p}교시</option>`).join('')}</select>
    </div>
    <div class="field"><label>상세 내용</label><textarea id="evDesc">${esc(ev.description)}</textarea></div>
    <div class="field"><label>첨부 문서</label>
      <input type="file" id="evFile" multiple>
      <div id="evAttachList">${(ev.attachments||[]).map(a=>`<div class="attach-item" data-att-id="${a.id}"><span data-open-att="${a.id}" data-att-name="${esc(a.name)}" style="cursor:pointer; text-decoration:underline;">📎 ${esc(a.name)}</span><button class="btn ghost sm" data-remove-att="${a.id}">삭제</button></div>`).join('')}</div>
    </div>
    <div class="switch-row"><span>알림 사용</span>
      <label class="switch"><input type="checkbox" id="evNotifEnabled" ${ev.notification&&ev.notification.enabled?'checked':''}><span class="slider"></span></label>
    </div>
    <div class="field"><label>알림 시간 (전날)</label>
      <select id="evNotifTime">
        ${['08:00','18:00','19:00','20:00','21:00'].map(v=>`<option value="${v}" ${(ev.notification&&ev.notification.time)===v?'selected':''}>전날 ${v}</option>`).join('')}
        <option value="custom" ${(ev.notification&&ev.notification.time && !['08:00','18:00','19:00','20:00','21:00'].includes(ev.notification.time))?'selected':''}>직접 설정</option>
      </select>
    </div>
    <div class="field" id="evNotifCustomWrap" style="${(ev.notification&&ev.notification.time && !['08:00','18:00','19:00','20:00','21:00'].includes(ev.notification.time))?'':'display:none;'}">
      <label>직접 설정한 시간</label>
      <input type="time" id="evNotifCustom" value="${(ev.notification&&ev.notification.time && !['08:00','18:00','19:00','20:00','21:00'].includes(ev.notification.time))?ev.notification.time:state.settings.notifDefaultTime}">
    </div>
    <div class="err" id="evErr">일정 제목과 날짜는 필수 입력 항목이에요.</div>
    <div class="modal-actions">
      ${existing? `<button class="btn danger" id="evDelete">삭제</button>`:''}
      <button class="btn ghost" id="evCancel">취소</button>
      <button class="btn" id="evSave">저장</button>
    </div>
  `);
  window._pendingAttachments = (ev.attachments||[]).slice();
  document.getElementById('evFile').addEventListener('change', async (e)=>{
    for(const f of e.target.files){
      const id = uid();
      const buf = await f.arrayBuffer();
      try{ await idbPut({id, name:f.name, type:f.type, data:buf}); }catch(err){}
      window._pendingAttachments.push({id, name:f.name, type:f.type});
      const wrap = document.getElementById('evAttachList');
      wrap.insertAdjacentHTML('beforeend', `<div class="attach-item" data-att-id="${id}"><span data-open-att="${id}" data-att-name="${esc(f.name)}" style="cursor:pointer; text-decoration:underline;">📎 ${esc(f.name)}</span><button class="btn ghost sm" data-remove-att="${id}">삭제</button></div>`);
      bindAttachOpen();
      bindAttachRemove();
    }
  });
  bindAttachRemove();
  const evNotifTimeSel = document.getElementById('evNotifTime');
  evNotifTimeSel.onchange = ()=>{ document.getElementById('evNotifCustomWrap').style.display = evNotifTimeSel.value==='custom'?'block':'none'; };
  const originalAttachIds = (ev.attachments||[]).map(a=>a.id);
  document.getElementById('evCancel').onclick = ()=>{
    window._pendingAttachments.filter(a=>!originalAttachIds.includes(a.id)).forEach(a=>idbDelete(a.id));
    closeModal();
  };
  if(existing) document.getElementById('evDelete').onclick = ()=>{
    openConfirm('이 일정을 삭제할까요?', ()=>{
      (ev.attachments||[]).forEach(a=>idbDelete(a.id));
      state.events = state.events.filter(x=>x.id!==ev.id);
      persist(); closeModal(); toast('일정을 삭제했어요.'); render();
    });
  };
  document.getElementById('evSave').onclick = ()=>{
    const title = document.getElementById('evTitle').value.trim();
    const date = document.getElementById('evDate').value;
    if(!title || !date){ document.getElementById('evErr').style.display='block'; return; }
    const notifTimeSel = document.getElementById('evNotifTime').value;
    const newEv = {
      id: ev.id || uid(),
      date, title,
      description: document.getElementById('evDesc').value.trim(),
      period: document.getElementById('evPeriod').value || null,
      startTime: document.getElementById('evStart').value || '',
      endTime: document.getElementById('evEnd').value || '',
      attachments: window._pendingAttachments,
      notification: {
        enabled: document.getElementById('evNotifEnabled').checked,
        type: 'dayBefore',
        time: notifTimeSel==='custom'? (document.getElementById('evNotifCustom').value || state.settings.notifDefaultTime) : notifTimeSel
      }
    };
    if(ev.id){ state.events = state.events.map(x=>x.id===ev.id?newEv:x); }
    else state.events.push(newEv);
    persist(); closeModal(); toast('일정을 저장했어요.'); render();
  };
}
async function downloadAttachment(id, name){
  const rec = await idbGet(id);
  if(!rec){ toast('첨부파일을 찾을 수 없어요. (다른 기기에서 추가된 파일은 이 기기에 없을 수 있어요)'); return; }
  const blob = new Blob([rec.data], {type: rec.type||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name || rec.name || 'attachment';
  a.target = '_blank';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function bindAttachRemove(){
  document.querySelectorAll('[data-remove-att]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.removeAtt;
      window._pendingAttachments = window._pendingAttachments.filter(a=>a.id!==id);
      idbDelete(id);
      btn.closest('.attach-item').remove();
    };
  });
  bindAttachOpen();
}
function bindAttachOpen(){
  document.querySelectorAll('[data-open-att]').forEach(el=>{
    el.onclick = ()=> downloadAttachment(el.dataset.openAtt, el.dataset.attName);
  });
}

function openEventDetail(id){
  const ev = state.events.find(e=>e.id===id);
  if(!ev) return;
  openEventModal(ev.date, ev);
}

/* ---------------- 교시(시간표) 수정 모달 ---------------- */
function openPeriodModal(dateStr, period, mode){
  // mode: 'day' (특정 날짜에서 열림, 선택지 제공) | 'recurring' (시간표 화면, 반복만 수정)
  const {periods} = getScheduleForDate(dateStr||todayStr());
  const existing = (periods||[]).find(p=>String(p.period)===String(period));
  const dow = mode==='recurring' ? scheduleDow : dowOf(dateStr);
  const rec = (state.schedule[dow]||[]).find(p=>String(p.period)===String(period));
  const base = existing || rec || {period: period||'', subject:'', teacher:'', startTime:'', endTime:''};
  openModal(`
    <h3>${period?period+'교시':'새 교시'} 수정</h3>
    <div class="field"><label>교시</label><input type="number" id="pfPeriod" min="1" value="${base.period||''}"></div>
    <div class="field"><label>과목</label><input id="pfSubject" value="${esc(base.subject||'')}"></div>
    <div class="field"><label>선생님</label><input id="pfTeacher" value="${esc(base.teacher||'')}"></div>
    <div class="row2">
      <div class="field"><label>시작 시간</label><input type="time" id="pfStart" value="${base.startTime||''}"></div>
      <div class="field"><label>종료 시간</label><input type="time" id="pfEnd" value="${base.endTime||''}"></div>
    </div>
    ${mode==='day' ? `
    <div class="hint">이 변경을 어떻게 적용할까요?</div>
    <div class="choice-row">
      <button class="btn ghost sm" id="pfThisDay">이 날짜만 변경</button>
      <button class="btn ghost sm" id="pfRecurring">이 요일의 반복 시간표 변경</button>
    </div>` : ''}
    <div class="modal-actions">
      ${existing||rec ? `<button class="btn danger" id="pfDelete">삭제</button>`:''}
      <button class="btn ghost" id="pfCancel">취소</button>
      ${mode!=='day' ? `<button class="btn" id="pfSave">저장</button>` : ''}
    </div>
  `);
  document.getElementById('pfCancel').onclick = closeModal;
  function collect(){
    return {
      period: Number(document.getElementById('pfPeriod').value),
      subject: document.getElementById('pfSubject').value.trim(),
      teacher: document.getElementById('pfTeacher').value.trim(),
      startTime: document.getElementById('pfStart').value,
      endTime: document.getElementById('pfEnd').value
    };
  }
  function saveThisDay(){
    const data = collect();
    const list = (state.overrides[dateStr] || (getScheduleForDate(dateStr).periods.slice())).filter(p=>String(p.period)!==String(period));
    list.push(data);
    state.overrides[dateStr] = list;
    persist(); closeModal(); toast('이 날짜의 시간표를 변경했어요.'); render();
  }
  function saveRecurring(){
    const data = collect();
    const targetDow = mode==='recurring' ? scheduleDow : dowOf(dateStr);
    const list = (state.schedule[targetDow]||[]).filter(p=>String(p.period)!==String(period));
    list.push(data);
    state.schedule[targetDow] = list;
    persist(); closeModal(); toast('반복 시간표를 변경했어요. (기존 예외 날짜는 유지됩니다)'); render();
  }
  if(mode==='day'){
    document.getElementById('pfThisDay').onclick = saveThisDay;
    document.getElementById('pfRecurring').onclick = saveRecurring;
  } else {
    document.getElementById('pfSave').onclick = saveRecurring;
  }
  const delBtn = document.getElementById('pfDelete');
  if(delBtn) delBtn.onclick = ()=>{
    if(mode==='day'){
      openModal(`
        <h3>삭제 방식 선택</h3>
        <p style="font-size:14px;color:var(--sub);">이 날짜의 예외만 삭제할지, 반복 시간표를 삭제할지 선택하세요.</p>
        <div class="modal-actions">
          <button class="btn ghost" id="delOverride">이 날짜 예외 삭제</button>
          <button class="btn danger" id="delRecurring">반복 시간표 삭제</button>
        </div>`);
      document.getElementById('delOverride').onclick = ()=>{
        if(state.overrides[dateStr]) state.overrides[dateStr] = state.overrides[dateStr].filter(p=>String(p.period)!==String(period));
        persist(); closeModal(); toast('예외 시간표를 삭제했어요.'); render();
      };
      document.getElementById('delRecurring').onclick = ()=>{
        state.schedule[dow] = (state.schedule[dow]||[]).filter(p=>String(p.period)!==String(period));
        persist(); closeModal(); toast('반복 시간표를 삭제했어요.'); render();
      };
    } else {
      openConfirm('이 교시를 반복 시간표에서 삭제할까요?', ()=>{
        state.schedule[scheduleDow] = (state.schedule[scheduleDow]||[]).filter(p=>String(p.period)!==String(period));
        persist(); toast('삭제했어요.'); render();
      });
    }
  };
}

      if(data.overrides) state.overrides = data.overrides;

/* ---------------- 카카오톡 "나에게 보내기" 연동 ---------------- */
/* Kakao JavaScript SDK 사용. 서버 없이 사용자의 카카오 로그인만으로 "나와의 채팅"에 메시지를 보낼 수 있음.
   (임의의 단체 채팅방으로의 자동 전송은 카카오 정책상 봇/서버 승인 없이는 불가능) */
function loadKakaoSDK(){
  return new Promise((resolve,reject)=>{
    if(window.Kakao){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject();
    document.head.appendChild(s);
  });
}
async function kakaoInit(){
  const key = state.settings.kakaoKey.trim();
  if(!key){ toast('Kakao JavaScript 키를 입력해주세요.'); return; }
  try{
    await loadKakaoSDK();
    if(!window.Kakao.isInitialized()) window.Kakao.init(key);
    toast('카카오 SDK에 연결했어요.');
  }catch(e){ toast('카카오 SDK 로드에 실패했어요. 네트워크를 확인해주세요.'); }
}
async function kakaoInitSilent(){
  // 새로고침/재방문 시 알림에서 자동으로 카카오톡을 보낼 수 있도록, 토스트 없이 SDK만 조용히 재연결하고 토큰을 복원
  const key = (state.settings.kakaoKey||'').trim();
  if(!key || !state.settings.kakaoLinked) return;
  try{
    await loadKakaoSDK();
    if(!window.Kakao.isInitialized()) window.Kakao.init(key);
    await ensureKakaoToken();
  }catch(e){ /* 네트워크 문제 시 다음 알림에서 재시도 */ }
}
function kakaoRedirectUri(){
  // 쿼리스트링(?code=...) 없이 현재 페이지 주소만 사용 — Kakao Developers > 카카오 로그인 > Redirect URI에 이 주소를 정확히 등록해야 함
  return location.origin + location.pathname;
}
async function kakaoLogin(){
  if(!window.Kakao || !window.Kakao.isInitialized()){ toast('먼저 SDK를 연결해주세요.'); return; }
  // 최신 Kakao SDK는 팝업 로그인(Auth.login)을 지원하지 않고, 페이지 이동(리다이렉트) 방식만 지원한다.
  // 로그인 동의 후 Kakao가 이 페이지로 다시 돌려보내며 주소 끝에 ?code=... 를 붙여준다.
  window.Kakao.Auth.authorize({ redirectUri: kakaoRedirectUri(), scope: 'talk_message' });
}
async function handleKakaoRedirect(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if(!code) return;
  const redirectUri = kakaoRedirectUri();
  history.replaceState({}, '', redirectUri); // 새로고침 시 중복 처리 방지를 위해 주소창의 code 제거
  const key = (state.settings.kakaoKey||'').trim();
  if(!key){ toast('카카오 JavaScript 키가 설정되어 있지 않아요.'); return; }
  try{
    await loadKakaoSDK();
    if(!window.Kakao.isInitialized()) window.Kakao.init(key);
    const res = await fetch('https://kauth.kakao.com/oauth/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'authorization_code', client_id:key, redirect_uri:redirectUri, code })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token){ toast('카카오 로그인 실패: '+(data.error_description||data.error||'알 수 없는 오류')); return; }
    state.settings.kakaoToken = { accessToken:data.access_token, refreshToken:data.refresh_token, expiresAt: Date.now()+(Number(data.expires_in||21599)*1000) };
    state.settings.kakaoLinked = true;
    window.Kakao.Auth.setAccessToken(data.access_token);
    persist();
    toast('카카오 로그인 완료!');
    render();
  }catch(e){ toast('카카오 로그인 처리 중 오류가 발생했어요.'); }
}
async function ensureKakaoToken(){
  const t = state.settings.kakaoToken;
  if(!t) return false;
  if(Date.now() < t.expiresAt - 60000){
    window.Kakao.Auth.setAccessToken(t.accessToken);
    return true;
  }
  const key = (state.settings.kakaoKey||'').trim();
  try{
    const res = await fetch('https://kauth.kakao.com/oauth/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'refresh_token', client_id:key, refresh_token:t.refreshToken })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token) return false;
    state.settings.kakaoToken = { accessToken:data.access_token, refreshToken: data.refresh_token || t.refreshToken, expiresAt: Date.now()+(Number(data.expires_in||21599)*1000) };
    persist();
    window.Kakao.Auth.setAccessToken(data.access_token);
    return true;
  }catch(e){ return false; }
}
async function kakaoSendToMe(title, body){
  if(!window.Kakao || !window.Kakao.isInitialized() || !state.settings.kakaoLinked){

/* ---------------- 기기 간 동기화 (Firebase Authentication + Firestore REST API) ----------------
   이제는 "누구나 아는 코드" 대신 실제 로그인 계정(이메일/비밀번호)으로 데이터를 보호한다.
   - Firebase Authentication(REST: Identity Toolkit)으로 로그인 → idToken 발급
   - idToken을 Authorization 헤더에 실어 Firestore REST API 호출
   - Firestore 문서 경로는 로그인한 사용자의 uid로 고정 (schoolendar-sync/{uid})
   - 보안 규칙 예시:
       match /databases/{db}/documents {
         match /schoolendar-sync/{uid} {
           allow read, write: if request.auth != null && request.auth.uid == uid;
         }
       }
     이 규칙을 쓰면 본인 계정으로 로그인한 사람만 자신의 문서를 읽고 쓸 수 있다.
   - idToken은 1시간 후 만료되므로 만료 시 refreshToken으로 자동 갱신한다.
   - 첨부파일(실제 문서 바이너리)은 용량 문제로 동기화 대상에서 제외되며, 기기별로만 보관된다.
------------------------------------------------------------------------- */
const SYNC_COLLECTION = 'schoolendar-sync';

function authState(){ return state.settings.auth || null; } // {email, uid, idToken, refreshToken, expiresAt}

async function authSignUp(email, password){
  const {syncApiKey} = state.settings;
  if(!syncApiKey) return {ok:false, reason:'no-key'};
  try{
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(syncApiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password, returnSecureToken:true})
    });
    const data = await res.json();
    if(!res.ok) return {ok:false, reason: data.error?.message || 'error'};
    saveAuth(data);
    return {ok:true};
  }catch(e){ return {ok:false, reason:'network'}; }
}
async function authSignIn(email, password){
  const {syncApiKey} = state.settings;
  if(!syncApiKey) return {ok:false, reason:'no-key'};
  try{
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(syncApiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password, returnSecureToken:true})
    });
    const data = await res.json();
    if(!res.ok) return {ok:false, reason: data.error?.message || 'error'};
    saveAuth(data);
    return {ok:true};
  }catch(e){ return {ok:false, reason:'network'}; }
}
function saveAuth(data){
  state.settings.auth = {
    email: data.email,
    uid: data.localId,
    idToken: data.idToken,
    refreshToken: data.refreshToken,
    expiresAt: Date.now() + (Number(data.expiresIn||3600)*1000)
  };
  persist();
}
async function authRefreshIfNeeded(){
  const a = authState();
  if(!a) return null;
  if(Date.now() < a.expiresAt - 60000) return a; // 아직 유효
  try{
    const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(state.settings.syncApiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(a.refreshToken)}`
    });
    const data = await res.json();
    if(!res.ok) return null;
    state.settings.auth = {
      email: a.email, uid: data.user_id,
      idToken: data.id_token, refreshToken: data.refresh_token,
      expiresAt: Date.now() + (Number(data.expires_in||3600)*1000)
    };
    persist();
    return state.settings.auth;
  }catch(e){ return null; }
}
function authSignOut(){
  state.settings.auth = null;
  persist();
}

function syncReady(){
  return !!(state.settings.syncEnabled && state.settings.syncProjectId && authState());
}
function syncDocUrl(uid){
  const {syncProjectId} = state.settings;
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(syncProjectId)}/databases/(default)/documents/${SYNC_COLLECTION}/${encodeURIComponent(uid)}`;
}
function buildSyncPayload(){
  // 기기별 개인정보(카카오 키, 로그인 토큰, 동기화 설정 자체)는 동기화 대상에서 제외
  const {kakaoKey, kakaoLinked, kakaoToken, syncEnabled, syncProjectId, syncApiKey, auth, ...syncableSettings} = state.settings;
  return {
    schedule: state.schedule,
    overrides: state.overrides,
    events: state.events, // 첨부파일은 메타데이터(이름)만 포함, 실제 파일 바이너리는 제외
    meals: state.meals,
    periodTimes: state.periodTimes,
    settings: syncableSettings,
    updatedAt: state.updatedAt
  };
}
async function syncPush(){
  if(!syncReady()) return {ok:false, reason:'not-configured'};
  const a = await authRefreshIfNeeded();
  if(!a) return {ok:false, reason:'auth-expired'};
  try{
    const payload = buildSyncPayload();
    const body = { fields: {
      data: { stringValue: JSON.stringify(payload) },
      updatedAt: { integerValue: String(state.updatedAt) }
    }};
    const res = await fetch(syncDocUrl(a.uid), {
      method:'PATCH', headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.idToken}, body: JSON.stringify(body)
    });
    if(!res.ok) return {ok:false, reason:'http-'+res.status};
    return {ok:true};
  }catch(e){ return {ok:false, reason:'network'}; }
}
async function syncPull(){
  if(!(state.settings.syncProjectId && authState())) return {ok:false, reason:'not-configured'};
  const a = await authRefreshIfNeeded();
  if(!a) return {ok:false, reason:'auth-expired'};
  try{
    const res = await fetch(syncDocUrl(a.uid), { headers:{'Authorization':'Bearer '+a.idToken} });
    if(res.status===404) return {ok:false, reason:'no-doc'};
    if(!res.ok) return {ok:false, reason:'http-'+res.status};
    const doc = await res.json();
    const raw = doc.fields && doc.fields.data && doc.fields.data.stringValue;
    if(!raw) return {ok:false, reason:'empty'};
    const payload = JSON.parse(raw);
    return {ok:true, payload};
  }catch(e){ return {ok:false, reason:'network'}; }
}
function applyCloudPayload(payload){
  state.schedule = payload.schedule || state.schedule;
  state.overrides = payload.overrides || state.overrides;
  state.events = payload.events || state.events;
  state.meals = payload.meals || state.meals;
  state.periodTimes = payload.periodTimes || state.periodTimes;
  state.settings = {...state.settings, ...(payload.settings||{})};
  state.updatedAt = payload.updatedAt || state.updatedAt;
  Store.save(LS.schedule, state.schedule);
  Store.save(LS.overrides, state.overrides);
  Store.save(LS.events, state.events);
  Store.save(LS.meals, state.meals);
  Store.save(LS.periodTimes, state.periodTimes);
  Store.save(LS.settings, state.settings);
  Store.save('sch_updatedAt', state.updatedAt);
}
let _pushTimer = null;
function schedulePush(){
  if(!syncReady()) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>{ syncPush(); }, 2500);
}
async function syncNow(direction){ // 'up' | 'down'
  if(!authState()){ toast('먼저 계정에 로그인해주세요.'); return; }
  if(!state.settings.syncProjectId){ toast('Firebase 프로젝트 ID를 입력해주세요.'); return; }
  if(direction==='up'){
    toast('업로드 중...');
    const r = await syncPush();
    toast(r.ok? '클라우드로 업로드했어요.' : '업로드에 실패했어요. 설정을 확인해주세요.');
  } else {
    toast('불러오는 중...');
    const r = await syncPull();
    if(r.ok){ applyCloudPayload(r.payload); toast('다른 기기의 데이터를 불러왔어요.'); render(); }
    else toast(r.reason==='no-doc' ? '아직 업로드된 데이터가 없어요. 먼저 업로드해보세요.' : '불러오기에 실패했어요.');
  }
}
async function syncOnBoot(){
  if(!syncReady()) return;
  const r = await syncPull();
  if(!r.ok) return; // 문서가 없거나 네트워크 실패 시 로컬 데이터로 계속 진행
  if((r.payload.updatedAt||0) > (state.updatedAt||0)){
    applyCloudPayload(r.payload);
    toast('다른 기기에서 최근에 저장한 데이터를 불러왔어요.');
    render();
  } else if((state.updatedAt||0) > (r.payload.updatedAt||0)){
    syncPush(); // 이 기기가 더 최신이면 클라우드를 갱신
  }
}

/* ---------------- 알림 엔진 ---------------- */
/* 앱이 열려 있는 동안 1분마다 오늘 발송 대상 알림을 확인해 인앱 알림센터 + (권한 있으면) 브라우저 알림 + (연동 시) 카카오톡으로 전송.
   백엔드가 없으므로 앱이 닫혀 있을 때는 발송할 수 없다는 한계가 있음. */
function buildTomorrowSummary(dateForNotif){ // dateForNotif = 알림이 발생하는 "다음날" 날짜
  const {periods} = getScheduleForDate(dateForNotif);
  const sorted = [...periods].sort((a,b)=>a.period-b.period);
  const schLines = sorted.length? sorted.map(p=>`${p.period}교시 ${p.subject}`).join('\n') : '시간표가 설정되지 않았습니다.';
  return schLines;
}
function checkAndFireNotifications(){
  const now = new Date();
  const nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const today = todayStr();

  // 일정 알림: 오늘이 "일정 날짜의 전날"이고, 알림 시간이 지금(분 단위)과 일치
  state.events.forEach(ev=>{
    if(!ev.notification || !ev.notification.enabled) return;
    const targetDate = addDays(ev.date,-1); // 전날
    if(targetDate!==today) return;
    if(ev.notification.time!==nowHM) return;
    const logId = 'ev_'+ev.id+'_'+ev.date;
    if(state.notifLog.some(n=>n.id===logId)) return;
    const schLines = buildTomorrowSummary(ev.date);
    const body = `내일 일정: ${ev.title}${ev.period?`\n관련 교시: ${ev.period}교시`:''}\n일정 내용: ${ev.description||'-'}\n\n내일 시간표\n${schLines}`;
    fireNotification(logId, `내일 일정 알림 · ${fmtMD(ev.date)}`, body);
  });

  // 급식 알림
  if(state.settings.mealNotifEnabled){
    const tomorrow = addDays(today,1);
    if(state.settings.mealNotifTime===nowHM){
      const logId = 'meal_'+tomorrow;
      if(!state.notifLog.some(n=>n.id===logId)){
        const m = mealOnDate(tomorrow);
        if(m && m.meals && m.meals.length){
          fireNotification(logId, `내일 급식 알림 · ${fmtMD(tomorrow)}`, m.meals.join('\n'));
        }
      }
    }
  }
}
function fireNotification(id, title, body){
  state.notifLog.push({id, title, body, time:new Date().toLocaleString('ko-KR'), read:false});
  persist();
  if('Notification' in window && Notification.permission==='granted'){
    new Notification(title, {body});
  }
  if(state.settings.kakaoLinked) kakaoSendToMe(title, body);
  updateNotifBadge();
  if(currentView==='notif' || currentView==='today') render();
}
setInterval(checkAndFireNotifications, 30000);
